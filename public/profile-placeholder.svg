<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f5f6f8" />
      <stop offset="55%" stop-color="#eef1fb" />
      <stop offset="100%" stop-color="#e7effa" />
    </linearGradient>

    <linearGradient id="figure" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#3b6cf6" />
      <stop offset="55%" stop-color="#7c5cf6" />
      <stop offset="100%" stop-color="#22b8d9" />
    </linearGradient>

    <radialGradient id="glowA" cx="26%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#7c5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowB" cx="82%" cy="70%" r="52%">
      <stop offset="0%" stop-color="#22b8d9" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#22b8d9" stop-opacity="0" />
    </radialGradient>

    <clipPath id="frame">
      <rect width="640" height="800" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="800" fill="url(#bg)" />
    <rect width="640" height="800" fill="url(#glowA)" />
    <rect width="640" height="800" fill="url(#glowB)" />

    <!-- Faint orbit rings, echoing the 3D scene behind the portrait. -->
    <g fill="none" stroke="#7c5cf6" stroke-opacity="0.18" stroke-width="1.5">
      <circle cx="320" cy="320" r="220" />
      <circle cx="320" cy="320" r="168" stroke-opacity="0.12" />
    </g>

    <!-- Head and shoulders, cropped by the frame the way a portrait plate is. -->
    <g fill="url(#figure)" opacity="0.92">
      <circle cx="320" cy="300" r="130" />
      <path d="M62 800c0-146 116-258 258-258s258 112 258 258z" />
    </g>

    <!-- Highlight so the silhouette reads as lit, not flat. -->
    <g fill="#ffffff" opacity="0.18">
      <circle cx="278" cy="262" r="50" />
      <path d="M134 800c8-106 80-190 178-216-120 8-218 100-224 216z" />
    </g>
  </g>
</svg>
